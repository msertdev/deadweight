<text x="22" y="558"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72" font-weight="bold">✗</tspan><tspan fill="#c9d1d9"> 151 of 214 skills are listed </tspan><tspan fill="#f0f6fc" font-weight="bold">without a description</tspan><tspan fill="#c9d1d9">: the skill listing is full</tspan></text>
<text x="22" y="578"><tspan fill="#8b949e">      (~30.0k characters). Claude sees only their names, so it can't tell when to use them.</tspan></text>
