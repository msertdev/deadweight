<text x="22" y="458"><tspan fill="#c9d1d9">  workflow-kit                   plugin          ~2.6k  </tspan><tspan fill="#3fb950">   14×</tspan><tspan fill="#8b949e">  hooks 2.2k · 11 skills</tspan></text>
