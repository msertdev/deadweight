<text x="22" y="678"><tspan fill="#c9d1d9">  Run </tspan><tspan fill="#f0f6fc" font-weight="bold">deadweight fix</tspan><tspan fill="#c9d1d9"> to disable 6 unused plugins and park 11 unused skills</tspan></text>
