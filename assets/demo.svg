<text x="22" y="498"><tspan fill="#c9d1d9">  marketing-suite                plugin          ~1.1k  </tspan><tspan fill="#ff7b72"> never</tspan><tspan fill="#8b949e">  18 tools · 14 skills</tspan></text>
